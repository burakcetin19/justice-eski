# ================================================================================
# JUSTICE — GPS + GÖRSEL HİBRİT TAKİP SİSTEMİ PARAMETRELERİ
# ================================================================================
# L1 Adaptive Guidance + YOLO/TCTrack++ PID Birleşik Konfigürasyonu
#
# Kullanım:
#   ros2 launch justice justice_sim.launch.py
# ================================================================================

justice_node:
  ros__parameters:

    # ==========================================
    # L1 GUIDANCE PARAMETRELERİ
    # ==========================================
    l1_guidance:
      l1_distance: 50.0           # L1 mesafesi (metre) — sanal hedef uzaklığı
      l1_damping: 0.85            # Sönümleme faktörü (0.7-0.9)
      l1_period: 25.0             # L1 periyodu (saniye)
      adaptive_l1: true           # Hıza bağlı adaptif L1 mesafesi

    # ==========================================
    # HEDEF SEÇİM AĞIRLIKLARI (Weighted Scoring)
    # ==========================================
    weights:
      distance: 0.25              # W1: Mesafe (yakın tercih)
      angle: 0.30                 # W2: Açı uygunluğu (kuyruk bonusu)
      speed: 0.15                 # W3: Hız (yavaş hedef tercih)
      camera_fov: 0.20            # W4: Kamera FOV uygunluğu
      reachability: 0.10          # W5: Ulaşılabilirlik

    # Açı Puanlama
    angle_scoring:
      tail_angle_bonus: 2.5       # Kuyruk pozisyonu çarpanı
      head_on_penalty: 0.2        # Kafa kafaya cezası
      tail_cone_half_angle: 45.0  # Kuyruk konisi (derece)
      head_on_cone_half_angle: 30.0

    # ==========================================
    # UÇAK FİZİĞİ SINIRLARI (Sabit Kanat)
    # ==========================================
    aircraft_limits:
      min_airspeed: 15.0          # Minimum hava hızı (m/s) — stall koruması
      max_airspeed: 35.0          # Maksimum hava hızı (m/s)
      cruise_airspeed: 22.0       # Cruise hızı (m/s)
      max_bank_angle: 45.0        # Maks yatış açısı (derece)
      loiter_radius: 40.0         # Loiter yarıçapı (metre)

    # ==========================================
    # SMOOTH KONTROL FİLTRELERİ (GPS Modu)
    # ==========================================
    smoothing:
      heading_rate_limit: 15.0    # Maks heading değişim hızı (°/s)
      altitude_rate_limit: 3.0    # Maks irtifa değişim hızı (m/s)
      command_smoothing_alpha: 0.15
      lpf_cutoff_heading: 0.5     # LPF cutoff (Hz)

    # ==========================================
    # L1 DURUM MAKİNESİ (GPS Takip Durumları)
    # ==========================================
    state_machine:
      lock_distance: 15.0         # Kilitlenme başlama mesafesi (m)
      approach_distance: 50.0     # Yaklaşma fazı (m)
      loiter_trigger_distance: 8.0
      lock_confirmation_time: 4.0 # 4 saniye kuralı

    # ==========================================
    # GÖRSEL TAKİP PID PARAMETRELERİ
    # ==========================================
    visual:
      # Yaw PID (Sağ/Sol kontrol)
      kp_yaw: 0.002
      ki_yaw: 0.0001
      kd_yaw: 0.001
      # Pitch PID (Yukarı/Aşağı kontrol)
      kp_pitch: 0.003
      ki_pitch: 0.0001
      kd_pitch: 0.001
      # Hız & Sınırlar
      max_yaw_rate: 0.5           # Maks yaw hızı (rad/s)
      max_vz: 3.0                 # Maks dikey hız (m/s)
      base_speed: 15.0            # Temel ileri hız (m/s)
      area_ref: 5000.0            # Referans hedef alanı (piksel²)
      kp_speed: 0.001             # Alan → hız katsayısı
      min_speed: 10.0             # Stall altı güvenlik hızı (m/s)
      max_speed: 25.0             # Maks ileri hız (m/s)

    # ==========================================
    # HİBRİT GEÇİŞ PARAMETRELERİ
    # ==========================================
    transition:
      gps_to_visual_distance: 30.0      # GPS→Görsel geçiş mesafe eşiği (m)
      min_consecutive_detections: 3     # Min ardışık kamera tespiti
      visual_lost_timeout: 10.0         # Görsel→GPS dönüş süresi (saniye)

    # ==========================================
    # PX4 İLETİŞİM
    # ==========================================
    px4:
      control_frequency: 50.0    # Kontrol döngüsü frekansı (Hz)
      namespace: ''              # PX4 namespace (boş = varsayılan)
      mav_sys_id: 1              # MAV_SYS_ID

    # ==========================================
    # GÜVENLİK
    # ==========================================
    safety:
      min_altitude_agl: 50.0     # Minimum yer üstü irtifa (m)

    # ==========================================
    # NAMESPACE (Multi-Vehicle SITL)
    # ==========================================
    namespaces:
      targets: '/px4_1,/px4_2'   # Hedef uçak namespace'leri
